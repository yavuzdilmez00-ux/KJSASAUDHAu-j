name: Gunluk Dua Botu

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dua-calistir:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip

      - name: Python Kodunu Çalıştır
        run: python dua_generator.py

      - name: Değişiklikleri Depoya Yaz (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tüm klasörü ve içindeki JSON dosyalarını git'e ekle
          git add dualar_klasoru/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik kayıt: Dualar türlerine göre ayrı JSON dosyalarına kaydedildi" && git push)
