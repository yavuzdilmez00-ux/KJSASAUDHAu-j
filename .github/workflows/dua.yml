name: Gunluk Dua Botu

on:
  schedule:
    - cron: '0 6 * * *' # Her sabah 06:00'da (UTC) otomatik çalışır
  workflow_dispatch: # GitHub arayüzünden manuel olarak tetikleyebilmeni sağlar

permissions:
  contents: write # Depoya (Repository) yazma izni verir!

jobs:
  dua-calistir:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          # JSON kütüphanesi Python'da gömülü olduğu için ekstra kurulum gerekmiyor.

      - name: Python Kodunu Çalıştır
        run: python dua_generator.py

      - name: Değişiklikleri Depoya Yaz (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dualar.json
          # Eğer dosyada değişiklik olmuşsa commit yap ve pushla
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik kayıt: Son okunan dua ve tarih JSON olarak güncellendi" && git push)
