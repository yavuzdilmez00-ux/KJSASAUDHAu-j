name: Otomatik Dua Jeneratörü (Saf ve Ücretsiz)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dış kütüphane kurulum adımı (pip install) tamamen kaldırıldı!
      
      - name: Dua Üreticiyi Çalıştır
        run: python dua_generator.py

      - name: Değişiklikleri Kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "🤖 Otomatik Dua Eklemesi: Veritabanı güncellendi" || echo "Değişiklik yok"
          git push
