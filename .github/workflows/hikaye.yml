name: İslami Hikayeleri Topla ve Kategorile

on:
  schedule:
    - cron: '0 12 * * 5' # Her Cuma saat 12:00'de otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Hikaye Botunu Çalıştır
      run: python hikaye_cekici.py

    - name: Değişiklikleri Depoya Yaz (Commit & Push)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # Tüm klasörü ve içindeki JSON dosyalarını ekle
        git add .
        
        git commit -m "feat: Yeni tarihi ve İslami hikayeler kategorilenerek eklendi" || echo "Yeni eklenecek bir hikaye bulunamadı."
        git push
