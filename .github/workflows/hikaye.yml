name: Akıllı İslami Hikaye Botu

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spider-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 trafilatura

    - name: Akıllı Botu Çalıştır
      run: python hikaye_cekici.py

    - name: Değişiklikleri Depoya Yaz (Commit & Push)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        git commit -m "bot: Örümcek ağından yeni hikayeler toplandı" || echo "Yeni eklenecek bir hikaye bulunamadı."
        git push
